version: '3'

services:

  logstash:
    image: jahrik/arm-logstash:arm32v7
    environment:
      ELASTICSEARCH_URL: "${ELASTICSEARCH_URL}"
    ports:
      - 5000:5000/udp
      - 5044:5044
    volumes:
      - /etc/logstash/:/etc/logstash/
    deploy:
      placement:
        constraints:
          - node.labels.arch == aarch64
