---
name: Build

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3

      - name: Test building image.
        run: just build test-image

      - name: Validate the pipeline config.
        run: |
          docker run --rm -e XPACK_MONITORING_ENABLED=false test-image \
            logstash -t -f /usr/share/logstash/pipeline/logstash.conf

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        run: just login docker.io "${{ secrets.DOCKERHUB_USERNAME }}" "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Build and push image.
        run: just release ${{ github.repository }}:latest
